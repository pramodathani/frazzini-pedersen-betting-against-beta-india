[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[project]
name = "frazzini-pedersen-india"
version = "0.1.0"
description = "Frazzini and Pedersen (2014) Betting Against Beta replicated on Indian shares: beta-sorted portfolios and the BAB factor on NSE, then long-only low-beta portfolios after Indian trading costs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Pramod Athani", email = "pramod.athani@gmail.com" },
]
keywords = [
    "betting-against-beta",
    "low-beta",
    "low-volatility",
    "frazzini-pedersen",
    "india",
    "nse",
    "quantitative-finance",
    "factor-investing",
    "backtesting",
    "replication",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
live = [
    "tradingmachine @ git+https://github.com/pramodathani/tradingmachine.git",
]
test = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/pramodathani/frazzini-pedersen-betting-against-beta-india"
Paper = "https://doi.org/10.1016/j.jfineco.2013.10.005"
Library = "https://github.com/pramodathani/tradingmachine"

[tool.hatch.build.targets.wheel]
packages = [
    "src/frazzini_pedersen_india",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"
